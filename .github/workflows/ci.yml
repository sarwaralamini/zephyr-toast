
# ZephyrToast Continuous Integration
#
# Runs automated tests, production builds, distribution
# verification, and npm package checks.
#
# Author: Md. Sarwar Alam
# License: MIT

name: CI

on:
  push:
    branches:
      - main
      - refactor/v2-architecture
      - "review/**"

  pull_request:
    branches:
      - main
      - refactor/v2-architecture

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build distribution
        run: npm run build

      - name: Verify distribution
        run: npm run verify:build

      - name: Validate npm package
        run: npm pack --dry-run

      - name: Verify TypeScript declaration
        run: |
          test -s dist/index.d.ts
          grep -q "class ZephyrToast" dist/index.d.ts

      - name: Check Git working tree
        run: |
          git diff --exit-code -- package.json package-lock.json
