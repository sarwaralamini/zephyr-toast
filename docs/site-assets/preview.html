<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZephyrToast Preview</title>

    <link rel="stylesheet" href="zephyr-toast-animate.css" />
    <link rel="stylesheet" href="zephyr-toast.css" />

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        background: #111b2c;
      }

      body[data-theme="light"] {
        background: #eef3fa;
      }
    </style>
  </head>
  <body data-theme="dark">
    <script src="zephyr-toast.js"></script>
    <script>
      /**
       * @fileoverview Isolated ZephyrToast demo preview.
       * @author Md. Sarwar Alam
       * @license MIT
       */

      "use strict";

      const toast = new ZephyrToast();

      window.addEventListener("message", (event) => {
        if (
          event.origin !== window.location.origin ||
          event.source !== window.parent
        ) {
          return;
        }

        const data = event.data;

        if (!data || data.channel !== "zephyr-demo-preview") {
          return;
        }

        if (data.action === "theme") {
          document.body.dataset.theme =
            data.theme === "light" ? "light" : "dark";
          return;
        }

        if (data.action === "clear") {
          toast.removeAll();
          return;
        }

        if (data.action === "show") {
          try {
            const options = data.options;

            if (
              typeof data.message !== "string" ||
              !options ||
              !["success", "info", "warning", "error", "zen", "void"].includes(
                options.type,
              )
            ) {
              return;
            }

            toast[options.type](data.message, options);
          } catch (error) {
            console.error("Preview notification failed:", error);
          }
        }
      });

      window.parent.postMessage(
        {
          channel: "zephyr-demo-preview",
          action: "ready",
        },
        window.location.origin,
      );
    </script>
  </body>
</html>
